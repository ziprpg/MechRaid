<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mech Raid — Sound & Armor Edition</title>
<style>html,body{margin:0;min-height:100%;background:#1c1b12;color:#bbb;font-family:monospace}body{display:flex;align-items:center;flex-direction:column;justify-content:center;min-height:100vh}canvas{display:block;width:min(480px,94vw,calc((100vh - 62px)*.75));height:auto;aspect-ratio:3/4;border:4px solid #3a3825;image-rendering:pixelated}p{margin:8px;font-size:12px;text-align:center}button{background:#29281c;color:#eee;border:1px solid #55523a;border-radius:4px;font-size:18px;width:36px;height:30px;cursor:pointer}footer{display:flex;align-items:center;gap:8px}</style></head>
<body><canvas id="c" aria-label="Mech Raid game"></canvas><footer><p>Arrows/WASD move · Up run · Down slow · Space fire</p><button id="sound" type="button" aria-label="Mute sound" aria-pressed="false" title="Sound">🔊</button></footer><script>(() => {
  // src/game/mechRaidOffline.ts
  var W = 480;
  var H = 640;
  var SEG = 40;
  var PLAYER_SY = 540;
  var MAX_AMMO = 60;
  var MAX_ARMOR = 100;
  var GATE_EVERY = 32;
  var SCORES = { tank: 60, turret: 100, infantry: 30, mecha: 200, base: 80, repair: 80, gate: 500 };

  class Game {
    state = "title";
    segs = [];
    ents = [];
    bullets = [];
    booms = [];
    cam = 0;
    px = W / 2;
    speed = 30;
    ammo = MAX_AMMO;
    armor = MAX_ARMOR;
    hitCd = 0;
    repairing = false;
    score = 0;
    hi = 0;
    lives = 3;
    sector = 1;
    fireCd = 0;
    deadT = 0;
    walk = 0;
    rearming = false;
    seed = 1;
    checkpointSeg = 0;
    onSound = () => {};
    rnd() {
      this.seed = this.seed * 16807 % 2147483647;
      return (this.seed - 1) / 2147483646;
    }
    reset(full) {
      if (full) {
        this.score = 0;
        this.lives = 3;
        this.sector = 1;
        this.checkpointSeg = 0;
      }
      this.seed = 12345 + this.checkpointSeg * 7;
      this.segs = [];
      this.ents = [];
      this.bullets = [];
      this.booms = [];
      this.cam = this.checkpointSeg * SEG;
      this.px = W / 2;
      this.speed = 30;
      this.ammo = MAX_AMMO;
      this.armor = MAX_ARMOR;
      this.hitCd = 0;
      this.rearming = false;
      this.repairing = false;
      this.fireCd = 0;
      this.walk = 0;
      this.genUntil(this.cam + H + SEG * 4);
      this.state = "play";
    }
    genSeg(i) {
      const prev = this.segs[i - 1];
      const rel = i - this.checkpointSeg;
      let center = prev ? (prev.left + prev.right) / 2 : W / 2;
      let width = prev ? prev.right - prev.left : 300;
      const gate = i > 0 && i % GATE_EVERY === 0;
      if (rel < 6 || gate || i % GATE_EVERY > GATE_EVERY - 3 || i % GATE_EVERY < 3) {
        width += (220 - width) * 0.5;
        center += (W / 2 - center) * 0.5;
      } else {
        width += (this.rnd() - 0.5) * 70;
        center += (this.rnd() - 0.5) * 50;
      }
      width = Math.max(150, Math.min(400, width));
      center = Math.max(width / 2 + 20, Math.min(W - width / 2 - 20, center));
      const left = center - width / 2, right = center + width / 2;
      let island = null;
      if (width > 290 && !gate && rel > 6 && i % GATE_EVERY > 3) {
        const pi = prev?.island;
        if (pi || this.rnd() < 0.15) {
          if (!pi || this.rnd() > 0.12) {
            const iw = pi ? Math.max(40, Math.min(110, pi[1] - pi[0] + (this.rnd() - 0.5) * 30)) : 50;
            island = [center - iw / 2, center + iw / 2];
          }
        }
      }
      const seg = { left, right, island, gate };
      this.segs[i] = seg;
      this.spawn(i, seg, rel);
      return seg;
    }
    spawn(i, s, rel) {
      const y = i * SEG + SEG / 2;
      const mk = (type, x, hp, w, h, vx = 0) => ({ type, x, y, vx, hp, cd: 1 + this.rnd() * 2, w, h, active: false, phase: this.rnd() * 6 });
      if (s.gate) {
        this.ents.push(mk("gate", (s.left + s.right) / 2, 4, s.right - s.left, 18));
        return;
      }
      if (rel < 8)
        return;
      const diff = Math.min(1, this.sector / 6);
      const r = this.rnd();
      const lane = () => {
        const lo = s.left + 25, hi = s.right - 25;
        let x = lo + this.rnd() * (hi - lo);
        if (s.island && x > s.island[0] - 20 && x < s.island[1] + 20)
          x = this.rnd() < 0.5 ? s.island[0] - 25 : s.island[1] + 25;
        return x;
      };
      if (i % 11 === 5 && this.rnd() < 0.8)
        this.ents.push(mk("base", lane(), 2, 44, 34));
      else if (i % 13 === 8)
        this.ents.push(mk("repair", lane(), 2, 44, 34));
      else if (r < 0.14 + diff * 0.06)
        this.ents.push(mk("tank", lane(), 2, 30, 22, (this.rnd() < 0.5 ? -1 : 1) * (40 + diff * 50)));
      else if (r < 0.22 + diff * 0.08)
        this.ents.push(mk("turret", this.rnd() < 0.5 ? s.left + 16 : s.right - 16, 3, 24, 24));
      else if (r < 0.32 + diff * 0.08) {
        const x = lane();
        for (let k = 0;k < 3; k++)
          this.ents.push({ ...mk("infantry", x + (k - 1) * 12, 1, 8, 10, (this.rnd() - 0.5) * 30) });
      } else if (r < 0.36 + diff * 0.08 && this.sector > 1)
        this.ents.push(mk("mecha", lane(), 4, 30, 30, 60));
    }
    genUntil(wy) {
      const last = Math.floor(wy / SEG);
      for (let i = 0;i <= last; i++)
        if (!this.segs[i])
          this.genSeg(i);
    }
    segAt(wy) {
      return this.segs[Math.floor(wy / SEG)];
    }
    sy(wy) {
      return H - (wy - this.cam);
    }
    playerWy() {
      return this.cam + (H - PLAYER_SY);
    }
    blocked(x, wy, hw) {
      const s = this.segAt(wy);
      if (!s)
        return false;
      if (x - hw < s.left || x + hw > s.right)
        return true;
      if (s.island && x + hw > s.island[0] && x - hw < s.island[1])
        return true;
      return false;
    }
    explode(x, y, big = false) {
      this.booms.push({ x, y, t: 0, big });
    }
    takeDamage(amount) {
      if (this.state !== "play" || this.hitCd > 0)
        return;
      this.armor = Math.max(0, this.armor - amount);
      this.hitCd = 0.75;
      if (this.armor === 0)
        this.die();
      else
        this.explode(this.px, this.playerWy());
    }
    constrainToCorridor(wy) {
      const s = this.segAt(wy);
      if (!s)
        return;
      this.px = Math.max(s.left + 16, Math.min(s.right - 16, this.px));
      if (s.island && this.px + 16 > s.island[0] && this.px - 16 < s.island[1]) {
        this.px = this.px < (s.island[0] + s.island[1]) / 2 ? s.island[0] - 16 : s.island[1] + 16;
      }
    }
    die() {
      this.explode(this.px, this.playerWy(), true);
      this.state = "dead";
      this.deadT = 0;
      this.lives--;
    }
    update(dt, inp) {
      this.booms = this.booms.filter((b) => (b.t += dt) < 0.6);
      if (this.state === "dead") {
        this.deadT += dt;
        if (this.deadT > 1.8) {
          if (this.lives <= 0) {
            this.state = "over";
            this.hi = Math.max(this.hi, this.score);
          } else
            this.reset(false);
        }
        return;
      }
      if (this.state !== "play")
        return;
      const target = inp.up ? 150 : inp.down ? 50 : 90;
      this.hitCd = Math.max(0, this.hitCd - dt);
      this.speed += Math.max(-30 * dt, Math.min(8 * dt, target - this.speed));
      this.cam += this.speed * dt;
      const previousStep = Math.floor((this.walk + Math.PI / 2) / Math.PI);
      this.walk += this.speed * dt * 0.08;
      const currentStep = Math.floor((this.walk + Math.PI / 2) / Math.PI);
      for (let step = previousStep;step < currentStep; step++)
        this.onSound("step");
      this.px += ((inp.right ? 1 : 0) - (inp.left ? 1 : 0)) * 170 * dt;
      this.genUntil(this.cam + H + SEG * 4);
      const pwy = this.playerWy();
      this.constrainToCorridor(pwy);
      this.fireCd -= dt;
      if (inp.fire && this.fireCd <= 0 && this.ammo > 0) {
        this.bullets.push({ x: this.px - 9, y: pwy + 14, vx: 0, vy: 520, enemy: false });
        this.bullets.push({ x: this.px + 9, y: pwy + 14, vx: 0, vy: 520, enemy: false });
        this.ammo -= 1;
        this.fireCd = 0.16;
        this.onSound("shot");
      }
      this.rearming = false;
      this.repairing = false;
      for (const e of this.ents) {
        const dy = e.y - pwy;
        if (dy < -60 || dy > H)
          continue;
        if (!e.active && dy < 380)
          e.active = true;
        e.phase += dt * 6;
        if (e.active && (e.type === "tank" || e.type === "mecha" || e.type === "infantry")) {
          const nx = e.x + e.vx * dt;
          if (this.blocked(nx, e.y, e.w / 2))
            e.vx = -e.vx;
          else
            e.x = nx;
          if (e.type === "mecha" && Math.abs(e.x - this.px) > 10 && this.rnd() < dt)
            e.vx = Math.sign(this.px - e.x) * Math.abs(e.vx);
        }
        if (e.active && (e.type === "turret" || e.type === "mecha" || e.type === "tank") && dy > 40) {
          e.cd -= dt;
          if (e.cd <= 0) {
            e.cd = e.type === "tank" ? 2.6 : e.type === "turret" ? 1.6 : 1.1;
            const ax = this.px - e.x, ay = pwy - e.y, d = Math.hypot(ax, ay) || 1;
            const sp = 170 + this.sector * 10;
            this.bullets.push({ x: e.x, y: e.y, vx: ax / d * sp, vy: ay / d * sp, enemy: true });
          }
        }
        if (Math.abs(e.x - this.px) < e.w / 2 + 10 && Math.abs(dy) < e.h / 2 + 12) {
          if (e.type === "base") {
            this.rearming = true;
            this.ammo = Math.min(MAX_AMMO, this.ammo + 25 * dt);
          } else if (e.type === "repair") {
            this.repairing = true;
            this.armor = Math.min(MAX_ARMOR, this.armor + 25 * dt);
          } else if (e.type === "infantry") {
            e.hp = 0;
            this.score += 10;
          } else {
            this.takeDamage(e.type === "gate" ? 40 : 25);
            if (this.state !== "play")
              return;
          }
        }
      }
      for (const b of this.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (b.enemy) {
          if (Math.abs(b.x - this.px) < 10 && Math.abs(b.y - pwy) < 14) {
            b.y = -1e9;
            this.takeDamage(20);
            if (this.state !== "play")
              return;
          }
        } else {
          if (this.blocked(b.x, b.y, 1) && !this.segAt(b.y)?.gate) {
            b.y = -1e9;
            continue;
          }
          for (const e of this.ents) {
            if (e.hp <= 0)
              continue;
            if (Math.abs(b.x - e.x) < e.w / 2 && Math.abs(b.y - e.y) < e.h / 2 + 4) {
              e.hp--;
              b.y = -1e9;
              if (e.hp <= 0) {
                this.onSound("destroy");
                this.score += SCORES[e.type];
                this.explode(e.x, e.y, e.type !== "infantry");
                if (e.type === "gate") {
                  this.sector++;
                  this.checkpointSeg = Math.floor(e.y / SEG) + 1;
                }
              }
              break;
            }
          }
        }
      }
      this.bullets = this.bullets.filter((b) => b.y > this.cam - 40 && b.y < this.cam + H + 40);
      this.ents = this.ents.filter((e) => e.hp > 0 && e.y > this.cam - 80);
    }
    draw(c) {
      c.fillStyle = "#3b3a2a";
      c.fillRect(0, 0, W, H);
      const first = Math.floor(this.cam / SEG) - 1;
      for (let i = first;i < first + H / SEG + 3; i++) {
        const s = this.segs[i];
        if (!s)
          continue;
        const y = this.sy((i + 1) * SEG);
        c.fillStyle = "#4d4a33";
        c.fillRect(0, y, W, SEG + 1);
        c.fillStyle = "#5c5940";
        for (let k = 0;k < 4; k++)
          c.fillRect((i * 97 + k * 131) % W, y + k * 13 % SEG, 18, 6);
        c.fillStyle = "#b39b6a";
        c.fillRect(s.left, y, s.right - s.left, SEG + 1);
        c.fillStyle = "#a68d5c";
        for (let k = 0;k < 3; k++)
          c.fillRect(s.left + (i * 53 + k * 71) % Math.max(1, s.right - s.left - 10), y + k * 13, 10, 3);
        c.fillStyle = "#2a2918";
        c.fillRect(s.left - 4, y, 4, SEG + 1);
        c.fillRect(s.right, y, 4, SEG + 1);
        if (s.island) {
          c.fillStyle = "#4d4a33";
          c.fillRect(s.island[0], y, s.island[1] - s.island[0], SEG + 1);
          c.fillStyle = "#2a2918";
          c.fillRect(s.island[0], y, 4, SEG + 1);
          c.fillRect(s.island[1] - 4, y, 4, SEG + 1);
        }
      }
      for (const e of this.ents)
        this.drawEnt(c, e);
      for (const b of this.bullets) {
        const y = this.sy(b.y);
        c.fillStyle = b.enemy ? "#ff4a3d" : "#fff27a";
        if (b.enemy) {
          c.beginPath();
          c.arc(b.x, y, 3.5, 0, 7);
          c.fill();
        } else
          c.fillRect(b.x - 1.5, y - 6, 3, 10);
      }
      if ((this.state === "play" || this.state === "title") && (this.hitCd <= 0 || Math.floor(this.hitCd * 14) % 2 === 0))
        this.drawMech(c, this.px, PLAYER_SY, this.walk, "#4fb3ff", "#1d5f99", false);
      for (const b of this.booms) {
        const y = this.sy(b.y), r = (b.big ? 28 : 12) * (0.4 + b.t * 1.6);
        c.globalAlpha = 1 - b.t / 0.6;
        c.fillStyle = "#ff8a1f";
        c.beginPath();
        c.arc(b.x, y, r, 0, 7);
        c.fill();
        c.fillStyle = "#fff07a";
        c.beginPath();
        c.arc(b.x, y, r * 0.5, 0, 7);
        c.fill();
        c.globalAlpha = 1;
      }
      this.drawHud(c);
    }
    drawMech(c, x, y, phase, col, dark, enemy) {
      const f = enemy ? -1 : 1;
      const l = Math.sin(phase) * 6;
      c.fillStyle = dark;
      c.fillRect(x - 10, y - 2 + l * f, 7, 14);
      c.fillRect(x + 3, y - 2 - l * f, 7, 14);
      c.fillStyle = "#222";
      c.fillRect(x - 11, y + 10 * f + l * f - (f < 0 ? 4 : 0), 9, 4);
      c.fillRect(x + 2, y + 10 * f - l * f - (f < 0 ? 4 : 0), 9, 4);
      c.fillStyle = col;
      c.fillRect(x - 12, y - 10, 24, 14);
      c.fillStyle = dark;
      c.fillRect(x - 16, y - 12, 6, 10);
      c.fillRect(x + 10, y - 12, 6, 10);
      c.fillStyle = "#555";
      c.fillRect(x - 15, y - 12 - 10 * (f > 0 ? 1 : -0.2), 4, 12);
      c.fillRect(x + 11, y - 12 - 10 * (f > 0 ? 1 : -0.2), 4, 12);
      c.fillStyle = enemy ? "#ff3b3b" : "#9ff7ff";
      c.fillRect(x - 4, y - 7, 8, 4);
    }
    drawEnt(c, e) {
      const y = this.sy(e.y);
      if (y < -60 || y > H + 60)
        return;
      const x = e.x;
      switch (e.type) {
        case "tank":
          c.fillStyle = "#3d4d2a";
          c.fillRect(x - 15, y - 11, 30, 22);
          c.fillStyle = "#1e2614";
          c.fillRect(x - 15, y - 11, 30, 4);
          c.fillRect(x - 15, y + 7, 30, 4);
          c.fillStyle = "#5b7040";
          c.beginPath();
          c.arc(x, y, 7, 0, 7);
          c.fill();
          c.fillRect(x - 2, y, 4, 14);
          break;
        case "turret":
          c.fillStyle = "#555";
          c.fillRect(x - 12, y - 12, 24, 24);
          c.fillStyle = "#888";
          c.beginPath();
          c.arc(x, y, 8, 0, 7);
          c.fill();
          c.fillStyle = "#333";
          c.fillRect(x - 2, y, 4, 15);
          c.fillStyle = "#ff3b3b";
          c.fillRect(x - 2, y - 2, 4, 4);
          break;
        case "infantry": {
          const s = Math.sin(e.phase) * 2;
          c.fillStyle = "#2f3b1e";
          c.fillRect(x - 3, y - 4, 6, 8);
          c.fillStyle = "#d9b38c";
          c.fillRect(x - 2, y - 7, 4, 3);
          c.fillStyle = "#1a1a1a";
          c.fillRect(x - 3, y + 4 + s, 2, 3);
          c.fillRect(x + 1, y + 4 - s, 2, 3);
          break;
        }
        case "mecha":
          this.drawMech(c, x, y, e.phase, "#c43a3a", "#6b1d1d", true);
          break;
        case "repair":
        case "base":
          c.fillStyle = "#2d3a4a";
          c.fillRect(x - 22, y - 17, 44, 34);
          c.fillStyle = e.type === "repair" ? "#5fdc5f" : "#e8d14a";
          for (let k = 0;k < 5; k++)
            c.fillRect(x - 22 + k * 9, y - 17, 5, 4);
          c.fillStyle = "#e8e8e8";
          c.font = "bold 9px monospace";
          c.textAlign = "center";
          c.fillText(e.type === "repair" ? "REPAIR" : "AMMO", x, y + 2);
          c.fillStyle = e.type === "repair" ? "#5fdc5f" : "#e8d14a";
          c.fillRect(x - 12, y + 7, 24, 5);
          break;
        case "gate":
          c.fillStyle = "#6e6e6e";
          c.fillRect(x - e.w / 2, y - 9, e.w, 18);
          c.fillStyle = "#e8d14a";
          for (let k = 0;k < e.w / 20; k++)
            c.fillRect(x - e.w / 2 + k * 20, y - 9, 10, 18);
          c.fillStyle = "#222";
          c.fillRect(x - e.w / 2, y - 2, e.w, 4);
          break;
      }
    }
    drawHud(c) {
      c.fillStyle = "#14140d";
      c.fillRect(0, H - 72, W, 72);
      c.font = "bold 12px monospace";
      c.textAlign = "left";
      c.fillStyle = "#e8d14a";
      c.fillText(`SCORE ${this.score}`, 12, H - 52);
      c.fillStyle = "#4fb3ff";
      c.fillText(`LIVES ${Math.max(0, this.lives)}`, 12, H - 32);
      c.fillStyle = "#aaa";
      c.fillText(`SECTOR ${this.sector}  SPEED ${Math.round(this.speed)}`, 12, H - 12);
      const bar = (label, value, max, y, color) => {
        c.textAlign = "left";
        c.fillStyle = "#ddd";
        c.fillText(label, 275, y + 10);
        c.fillStyle = "#333";
        c.fillRect(330, y, 100, 12);
        c.fillStyle = value < max * 0.25 ? "#ff3b3b" : color;
        c.fillRect(330, y, 100 * value / max, 12);
        c.textAlign = "right";
        c.fillStyle = "#ddd";
        c.fillText(String(Math.ceil(value)), 468, y + 10);
      };
      bar("AMMO", this.ammo, MAX_AMMO, H - 60, "#e8d14a");
      bar("ARMOR", this.armor, MAX_ARMOR, H - 36, "#5fdc5f");
      c.textAlign = "center";
      if (this.repairing || this.rearming) {
        c.fillStyle = "#5fdc5f";
        c.fillText(this.repairing ? "REPAIRING" : "REARMING", W / 2, H - 82);
      } else if (this.state === "play" && (this.ammo < 12 || this.armor < 25)) {
        c.fillStyle = "#ff3b3b";
        c.fillText(this.armor < 25 ? "LOW ARMOR" : "LOW AMMO", W / 2, H - 82);
      }
      if (this.state === "title" || this.state === "over") {
        c.fillStyle = "rgba(10,10,6,0.78)";
        c.fillRect(0, 0, W, H - 72);
        c.textAlign = "center";
        c.fillStyle = "#e8d14a";
        c.font = "34px 'Press Start 2P', monospace";
        c.fillText(this.state === "over" ? "GAME OVER" : "MECH RAID", W / 2, 220);
        c.font = "11px 'Press Start 2P', monospace";
        c.fillStyle = "#ddd";
        if (this.state === "over")
          c.fillText(`SCORE ${this.score}   BEST ${this.hi}`, W / 2, 270);
        c.fillText("Destroy gates to advance", W / 2, 320);
        c.fillText("Walk over AMMO bases to rearm", W / 2, 345);
        c.fillText("Walk over REPAIR bases for armor", W / 2, 370);
        c.fillText("Side walls are harmless", W / 2, 395);
        c.fillStyle = "#4fb3ff";
        c.fillText("PRESS SPACE / TAP START", W / 2, 430);
      }
    }

  class OfflineAudio {
    context = null;
    muted = false;
    master = null;
    noise = null;
    voice = null;
    unlock() {
      if (!this.context && typeof AudioContext !== "undefined") {
        this.context = new AudioContext;
        this.master = this.context.createGain();
        this.master.gain.value = this.muted ? 0 : 0.55;
        this.master.connect(this.context.destination);
        this.noise = this.context.createBuffer(1, this.context.sampleRate, this.context.sampleRate);
        const data = this.noise.getChannelData(0);
        for (let i = 0;i < data.length; i++)
          data[i] = Math.random() * 2 - 1;
      }
      this.context?.resume().catch(() => {});
    }
    opening() {
      this.unlock();
      if (!this.voice)
        this.voice = new Audio(openingVoice);
      this.voice.currentTime = 0;
      this.voice.volume = 0.85;
      this.voice.muted = this.muted;
      this.voice.play().catch(() => {});
    }
    toggle() {
      this.muted = !this.muted;
      if (this.master)
        this.master.gain.value = this.muted ? 0 : 0.55;
      if (this.voice)
        this.voice.muted = this.muted;
      this.unlock();
      return this.muted;
    }
    play = (sound) => {

      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

      source.stop(t + duration);
      source.onended = () => {
        source.disconnect();
        filter.disconnect();
        gain.disconnect();
      };
      const osc = c.createOscillator(), bass = c.createGain();
      osc.type = sound === "shot" ? "triangle" : "sine";
      osc.frequency.setValueAtTime(sound === "shot" ? 220 : sound === "destroy" ? 105 : 72, t);
      osc.frequency.exponentialRampToValueAtTime(28, t + duration);
      bass.gain.setValueAtTime(sound === "step" ? 0.55 : 0.65, t);
      bass.gain.exponentialRampToValueAtTime(0.001, t + duration);
      osc.connect(bass);
      bass.connect(out);
      osc.start(t);
      osc.stop(t + duration);
      osc.onended = () => {
        osc.disconnect();
        bass.disconnect();
      };
    };
  }

  // src/game/mechRaidOfflineEntry.ts
  var canvas = document.querySelector("#c");
  if (!canvas)
    throw new Error("Missing game canvas");
  canvas.width = W;
  canvas.height = H;
  var ctx = canvas.getContext("2d");
  if (!ctx)
    throw new Error("Canvas unavailable");
  var audio = new OfflineAudio;
  var game = new Game;
  game.onSound = audio.play;
  var readBest = () => {
    try {
      return Number(localStorage.getItem("mechraid-hi") || 0);
    } catch {
      return 0;
    }
  };
  game.hi = readBest();
  game.reset(true);
  game.state = "title";
  var input = { left: false, right: false, up: false, down: false, fire: false };
  var map = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", Space: "fire" };
  function start() {
    if (game.state === "title" || game.state === "over") {
      audio.opening();
      game.reset(true);
      input.fire = false;
    }
  }
  var mute = document.querySelector("#sound");
  mute?.addEventListener("click", () => {
    const muted = audio.toggle();
    mute.textContent = muted ? "\uD83D\uDD07" : "\uD83D\uDD0A";
    mute.setAttribute("aria-pressed", String(muted));
    mute.setAttribute("aria-label", muted ? "Enable sound" : "Mute sound");
  });
  addEventListener("keydown", (e) => {
    const k = map[e.code];
    if (k) {
      e.preventDefault();
      input[k] = true;
    }
    if (e.code === "Space" || e.code === "Enter")
      start();
  });
  addEventListener("keyup", (e) => {
    const k = map[e.code];
    if (k)
      input[k] = false;
  });
  addEventListener("blur", () => {
    for (const k of Object.keys(input))
      input[k] = false;
  });
  canvas.addEventListener("click", start);
  var last = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    game.update(dt, input);
    if (game.state === "over" && game.hi > readBest()) {
      try {
        localStorage.setItem("mechraid-hi", String(game.hi));
      } catch {}
    }
    if (ctx)
      game.draw(ctx);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script></body></html>
